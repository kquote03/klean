# Reusable build: the milestone gate (build + unit tests + instrumented-test compile)
# plus the signed debug APK as an artifact. Called by ci.yml and nightly.yml.
name: build

on:
  workflow_call:
    outputs:
      version_name:
        value: ${{ jobs.gate.outputs.version_name }}
    secrets:
      DEBUG_KEYSTORE_B64:
        required: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Same key as local debug builds, so a nightly APK installs over a local install
      # (and vice versa) without losing data. Absent on fork PRs: AGP then makes a throwaway key.
      - name: Install debug signing key
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "KLEAN_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Gate
        run: ./gradlew assembleDebug :app:assembleDebugAndroidTest :shared:jvmTest testDebugUnitTest verifyRoborazziDebug --console=plain

      - name: Check the APK is signed with the shared debug key
        if: env.KLEAN_DEBUG_KEYSTORE != ''
        run: |
          digest=$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p')
          echo "signed with $digest"
          test "$digest" = "105be2212f0a3aff9b1015bd29797c9b70bfd386f58bac3de9ae75429633ed52"

      - name: Version
        id: version
        run: echo "name=0.1.0-$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "klean-debug-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: klean-debug-*.apk
          retention-days: 30

      # Wear OS app (M27). Already built by assembleDebug above; named here so it's explicit. Signed with the
      # same key as the phone, which the Data Layer needs to pair the two apps.
      - name: Wear app
        run: ./gradlew :wear:assembleDebug --console=plain

      - name: Check the wear APK is signed with the shared debug key
        if: env.KLEAN_DEBUG_KEYSTORE != ''
        run: |
          digest=$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs wear/build/outputs/apk/debug/wear-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p')
          echo "signed with $digest"
          test "$digest" = "105be2212f0a3aff9b1015bd29797c9b70bfd386f58bac3de9ae75429633ed52"

      - name: Rename wear APK
        run: cp wear/build/outputs/apk/debug/wear-debug.apk "klean-wear-debug-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: wear-apk
          path: klean-wear-debug-*.apk
          retention-days: 30

  # The web client (M26): unit tests (capture rules against the shared fixture, LWW, queue, tokens and
  # contrast, copy), type check and production build, and the copy guard. Separate from the gate and backend.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Copy check
        run: pnpm check-copy
