# Dated pre-release each night (00:00 Asia/Dubai) when main has new commits since the last one.
name: nightly

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC = 00:00 Asia/Dubai
  workflow_dispatch:

concurrency:
  group: nightly-dated

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      previous: ${{ steps.diff.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          prev=$(git tag --list 'nightly-20*' --sort=-creatordate | head -1)
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ] && [ "$(git rev-list -n1 "$prev")" = "$(git rev-parse HEAD)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Create the dated pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ needs.check.outputs.previous }}
          VERSION: ${{ needs.build.outputs.version_name }}
        run: |
          tag="nightly-$(TZ=Asia/Dubai date +%Y-%m-%d)"
          if [ -n "$PREV" ]; then range="$PREV..HEAD"; else range="HEAD~30..HEAD"; fi
          { echo "Debug build $VERSION. Installs as app.klean.debug."; echo; echo "Changes:"; git log --format='- %s (%h)' "$range"; } > notes.md
          gh release create "$tag" klean-debug-*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $(TZ=Asia/Dubai date +%Y-%m-%d) ($VERSION)" --notes-file notes.md
