# klean-server image (Dockerfile at the repo root: the sync server with the web app at /).
# Every run: backend tests, an amd64 build that is started and smoke-tested, and a reproducibility check (two
# clean builds, same digest). Pushes to main and milestone tags (inputs.push): a linux/amd64 + linux/arm64 push to
# ghcr.io/<owner>/klean-server. Called by ci.yml.
name: docker

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The full Gradle build (not -Pklean.serverOnly) configures the Android modules too.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Backend tests
        run: ./gradlew :backend:test --console=plain

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version = commit count

      - uses: docker/setup-buildx-action@v3

      - name: Tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short="$(git rev-parse --short HEAD)"
          image="ghcr.io/$owner/klean-server"
          tags="$image:0.1.0-$(git rev-list --count HEAD)-$short,$image:sha-$short"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags="$tags,$image:main,$image:latest"; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tags="$tags,$image:$GITHUB_REF_NAME"; fi
          {
            echo "image=$image"
            echo "tags=$tags"
            echo "epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"

      - name: Build (linux/amd64) and load
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: klean-server:ci
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: scripts/image-smoke.sh klean-server:ci

      - name: Reproducible build check
        run: scripts/image-repro.sh linux/amd64

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (linux/amd64 + linux/arm64)
        id: push
        if: inputs.push
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: REVISION=${{ github.sha }}
          outputs: type=image,push=true,rewrite-timestamp=true
          cache-from: type=gha

      - name: Summary
        if: inputs.push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "Pushed \`$DIGEST\` as:"
            echo "$TAGS" | tr ',' '\n' | sed "s/^/- \`/; s/\$/\`/"
          } >> "$GITHUB_STEP_SUMMARY"
