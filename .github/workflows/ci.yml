# Every push and PR runs the gate. Every push to main also refreshes the rolling
# "nightly" pre-release, so the newest APK is always at:
#   https://github.com/<owner>/<repo>/releases/download/nightly/klean-debug.apk
# and the Wear OS app (M27) next to it at .../nightly/wear-debug.apk.
# The server image (backend + web) is tested on every run and pushed to GHCR on pushes to main and on
# milestone tags (m*, p*): ghcr.io/<owner>/klean-server (see docker.yml).
name: ci

on:
  push:
    branches: [main]
    tags: ["m*", "p*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  docker:
    uses: ./.github/workflows/docker.yml
    with:
      push: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write

  rolling-release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rolling-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: actions/download-artifact@v4
        with:
          name: wear-apk
      - name: Replace the "nightly" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version_name }}
        run: |
          cp klean-debug-*.apk klean-debug.apk
          cp klean-wear-debug-*.apk wear-debug.apk
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly klean-debug.apk klean-debug-*.apk wear-debug.apk klean-wear-debug-*.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest main ($VERSION)" \
            --notes "Debug build of ${GITHUB_SHA::7}: $(gh api repos/$GH_REPO/commits/$GITHUB_SHA --jq '.commit.message | split("\n")[0]')

          Installs as app.klean.debug, over any earlier nightly or local debug build. wear-debug.apk is the Wear OS app (same id and key, so it pairs with the phone app). This release is replaced on every push to main."
