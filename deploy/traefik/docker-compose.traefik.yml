# Traefik in front of the Klean backend with Let's Encrypt. Use together with the base file:
#   docker compose -f deploy/docker-compose.yml -f deploy/traefik/docker-compose.traefik.yml up -d
# Set KLEAN_HOST_NAME (e.g. klean.example.com), ACME_EMAIL and KLEAN_PUBLIC_URL=https://$KLEAN_HOST_NAME.
services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt

  klean:
    # The proxy reaches the container on the compose network; don't publish 8080 on all interfaces.
    ports: !override
      - "127.0.0.1:8080:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.klean.rule=Host(`${KLEAN_HOST_NAME}`)
      - traefik.http.routers.klean.entrypoints=websecure
      - traefik.http.routers.klean.tls.certresolver=le
      - traefik.http.services.klean.loadbalancer.server.port=8080
      - traefik.http.middlewares.klean-wellknown.redirectregex.regex=^https://([^/]+)/\.well-known/(card|cal)dav
      - traefik.http.middlewares.klean-wellknown.redirectregex.replacement=https://$${1}/dav/
      - traefik.http.middlewares.klean-wellknown.redirectregex.permanent=true
      - traefik.http.routers.klean.middlewares=klean-wellknown

volumes:
  traefik-acme:
